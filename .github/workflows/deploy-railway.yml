name: 🚀 Deploy Nexa to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Build all workspace packages ─────────────────────────────────────
  packages-build:
    name: 📦 Build Packages
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.3.1'

      - name: Enable Corepack & install Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Archive packages build
        run: |
          git ls-files -oi --exclude-standard \
            -- \
            ':(exclude)node_modules/*' \
            ':(exclude)**/node_modules/*' \
            ':(exclude)**/.meteor/*' \
            ':(exclude)**/.turbo/*' \
            ':(exclude).turbo/*' \
            ':(exclude)**/.yarn/*' \
            ':(exclude).yarn/*' \
            ':(exclude).git/*' \
          | tar -czf /tmp/nexa-packages-build.tar.gz -T -

      - name: Upload packages build
        uses: actions/upload-artifact@v7
        with:
          name: packages-build
          path: /tmp/nexa-packages-build.tar.gz
          retention-days: 3

  # ── Step 2: Meteor build ──────────────────────────────────────────────────────
  meteor-build:
    name: 🌠 Meteor Build
    needs: [packages-build]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.3.1'

      - name: Enable Corepack & install Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download packages build artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-build
          path: /tmp

      - name: Restore packages build
        run: tar -xzf /tmp/nexa-packages-build.tar.gz

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          export PATH="$HOME/.meteor:$PATH"
          meteor --version

      - name: Meteor build
        working-directory: apps/meteor
        run: |
          export PATH="$HOME/.meteor:$PATH"
          meteor build \
            --server-only \
            --directory /tmp/nexa-bundle \
            --allow-superuser

      - name: Archive Meteor bundle
        run: tar -czf /tmp/nexa-bundle.tar.gz -C /tmp/nexa-bundle .

      - name: Upload Meteor bundle
        uses: actions/upload-artifact@v7
        with:
          name: nexa-bundle
          path: /tmp/nexa-bundle.tar.gz
          retention-days: 3

  # ── Step 3: Build & push Docker image to GHCR ────────────────────────────────
  docker-build-push:
    name: 🐳 Build & Push Docker Image
    needs: [meteor-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Meteor bundle
        uses: actions/download-artifact@v4
        with:
          name: nexa-bundle
          path: /tmp

      - name: Extract bundle for Docker context
        run: |
          mkdir -p /tmp/docker-context
          tar -xzf /tmp/nexa-bundle.tar.gz -C /tmp/docker-context

      - name: Copy Dockerfile into context
        run: |
          cp apps/meteor/.docker/Dockerfile.debian /tmp/docker-context/Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Nexa Docker image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/docker-context
          file: /tmp/docker-context/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/nexa:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/nexa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image summary
        run: |
          echo "### 🚀 Nexa Docker image pushed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ steps.repo.outputs.owner }}/nexa:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Point your Railway service to this image and redeploy." >> $GITHUB_STEP_SUMMARY
